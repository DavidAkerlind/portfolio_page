<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#22405f" />
			<stop offset="1" stop-color="#0f1e30" />
		</linearGradient>

		<!-- Colourless liquid glass, the same recipe as the GlassLogo component:
		     a faint body, a bright rim lit from the top left, a softer one from the
		     bottom right, a thin edge line and a shadow outside the shape. -->
		<filter id="glass" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
			<feGaussianBlur in="SourceAlpha" stdDeviation="0.9" result="height" />
			<feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="soft" />

			<feSpecularLighting in="height" surfaceScale="2.4" specularConstant="1.7" specularExponent="20" lighting-color="#fff" result="litTopLeft">
				<feDistantLight azimuth="225" elevation="38" />
			</feSpecularLighting>
			<feComposite in="litTopLeft" in2="SourceAlpha" operator="in" result="rimTopLeft" />

			<feSpecularLighting in="height" surfaceScale="2.4" specularConstant="0.8" specularExponent="16" lighting-color="#fff" result="litBottomRight">
				<feDistantLight azimuth="45" elevation="30" />
			</feSpecularLighting>
			<feComposite in="litBottomRight" in2="SourceAlpha" operator="in" result="rimBottomRight" />

			<feSpecularLighting in="soft" surfaceScale="6" specularConstant="0.4" specularExponent="2.5" lighting-color="#fff" result="litSheen">
				<feDistantLight azimuth="225" elevation="55" />
			</feSpecularLighting>
			<feComposite in="litSheen" in2="SourceAlpha" operator="in" result="sheen" />

			<feFlood flood-color="#fff" flood-opacity="0.2" />
			<feComposite in2="SourceAlpha" operator="in" result="body" />

			<feMorphology in="SourceAlpha" operator="erode" radius="0.4" result="eroded" />
			<feComposite in="SourceAlpha" in2="eroded" operator="out" result="edge" />
			<feComponentTransfer in="edge" result="edgeLine">
				<feFuncA type="linear" slope="0.6" />
			</feComponentTransfer>

			<feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="shadowBlur" />
			<feOffset in="shadowBlur" dy="1.5" result="shadowOffset" />
			<feFlood flood-color="#020a14" flood-opacity="0.6" />
			<feComposite in2="shadowOffset" operator="in" result="shadowFull" />
			<feComposite in="shadowFull" in2="SourceAlpha" operator="out" result="shadow" />

			<feMerge>
				<feMergeNode in="shadow" />
				<feMergeNode in="body" />
				<feMergeNode in="sheen" />
				<feMergeNode in="edgeLine" />
				<feMergeNode in="rimBottomRight" />
				<feMergeNode in="rimTopLeft" />
			</feMerge>
		</filter>
	</defs>

	<rect width="64" height="64" rx="14" fill="url(#tile)" />

	<!-- A bold D: a thick stem and bowl round a small counter. -->
	<path
		fill="#fff"
		fill-rule="evenodd"
		filter="url(#glass)"
		transform="translate(32.5 32) scale(1.2) translate(-32.5 -32)"
		d="M19 14H30C42.5 14 49 21.5 49 32C49 42.5 42.5 50 30 50H19Q16 50 16 47V17Q16 14 19 14Z
		   M27 23V41H30C35.5 41 39 37.5 39 32C39 26.5 35.5 23 30 23Z" />
</svg>

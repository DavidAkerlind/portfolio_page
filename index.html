		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1e30" media="(prefers-color-scheme: dark)" />
		<script>
			// Apply the saved colour theme before the first paint, so the page never flashes.
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.dataset.theme = t;
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
						m.content = t === 'light' ? '#eef1f7' : '#0f1e30';
					});
				}
			} catch (e) {}
		</script>

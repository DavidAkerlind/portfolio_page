<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3554;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1e30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bfb5ce;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#908faa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#375a88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334b6d;stop-opacity:1" />
    </linearGradient>
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)" />

  <!-- Subtle inner ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#375a88" stroke-width="0.5" opacity="0.4"/>

  <!-- Blue accent arc (top-right quarter) -->
  <path d="M 32 4 A 28 28 0 0 1 60 32" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- The D letterform — constructed as a path for full control -->
  <!-- Vertical stem + curved body -->
  <path
    d="M 18 14
       L 18 50
       L 30 50
       C 46 50 52 42 52 32
       C 52 22 46 14 30 14
       Z"
    fill="none"
    stroke="url(#dGrad)"
    stroke-width="3.5"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Inner cutout so it looks like a proper D outline -->
  <path
    d="M 23 19
       L 23 45
       L 29.5 45
       C 42 45 47 38.5 47 32
       C 47 25.5 42 19 29.5 19
       Z"
    fill="url(#bgGrad)"
  />

  <!-- Small accent dot bottom-right of D -->
  <circle cx="46" cy="48" r="2.5" fill="#375a88" opacity="0.9"/>
</svg>
